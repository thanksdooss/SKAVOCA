spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skavoca}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:jin}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      continue-on-error: true

jwt:
  secret: ${JWT_SECRET:dev-only-skavoca-local-secret-key-not-for-production-256bit}
  access-expiration: 1800000
  refresh-expiration: 604800000
