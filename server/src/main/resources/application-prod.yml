spring:
  datasource:
    # Neon 등 외부 DB는 DB_SSLMODE=require 로 설정
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skavoca}?sslmode=${DB_SSLMODE:prefer}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:jin}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      continue-on-error: true

jwt:
  # 운영 환경에서는 JWT_SECRET 환경변수가 반드시 필요하다 (기본값 없음)
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 604800000
