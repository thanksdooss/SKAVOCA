spring:
  application:
    name: skavoca-server
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/skavoca
    driver-class-name: org.postgresql.Driver
    username: jin
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

server:
  port: 8080

jwt:
  # 비워두면 로컬 실행 시 임의의 키가 생성된다. 운영 환경은 application-prod.yml 참고
  secret: ${JWT_SECRET:}
  access-expiration: 1800000
  refresh-expiration: 604800000
