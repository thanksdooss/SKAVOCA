spring:
  application:
    name: skavoca-server
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/skavoca
    driver-class-name: org.postgresql.Driver
    username: jin
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-only-skavoca-local-secret-key-not-for-production-256bit}
  access-expiration: 1800000
  refresh-expiration: 604800000
